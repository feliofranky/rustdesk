name: Build HerzView Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

env:
  ANDROID_FLUTTER_VERSION: "3.24.5"
  VERSION: "1.5.3"

jobs:
  build-herzview-android:
    name: Build HerzView arm64 APK (Xiaomi 11T Pro)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Install flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}
          cache: true

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{env.ANDROID_FLUTTER_VERSION}} ]]; then
            git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff || true
          fi

      - name: Verify prebuilt native libs
        run: |
          ls -la ./flutter/android/app/src/main/jniLibs/arm64-v8a/

      - name: Build HerzView APK
        shell: bash
        run: |
          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties
          cat << 'EOF' > ./flutter/android/key.properties
          storePassword=HerzView2026SecureKey
          keyPassword=HerzView2026SecureKey
          keyAlias=herzview
          storeFile=herzview-release.jks
          EOF
          cp ./flutter/android/key.properties ./flutter/android/app/key.properties
          
          pushd flutter
          flutter build apk --release --target-platform android-arm64 --split-per-abi
          popd
          mkdir -p output-apk
          cp flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk output-apk/HerzView-arm64-v8a.apk

      - name: Upload HerzView APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HerzView-arm64-v8a
          path: output-apk/HerzView-arm64-v8a.apk
